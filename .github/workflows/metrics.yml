name: Metrics

# Renders the profile infographic (lowlighter/metrics) once a day and on demand.
# The image is committed to the `output` branch so the README can embed it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Berlin
          config_display: large
          repositories_forks: false
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 300
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_recent_days: 14
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_lines: yes
          plugin_achievements: yes
          plugin_achievements_threshold: A
          plugin_achievements_secrets: no
          plugin_achievements_display: detailed
